<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | SeleniumCraft</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
        }
        .wrap { max-width: 480px; padding: 24px; }
        h1 { font-size: 5rem; font-weight: 800; letter-spacing: -0.06em; margin-bottom: 8px; }
        p { color: #888; font-size: 1.1rem; margin-bottom: 32px; line-height: 1.5; }
        .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a {
            padding: 12px 24px;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: filter 0.2s;
        }
        a:hover { filter: brightness(1.1); }
        .primary { background: #7c6ef5; color: #fff; }
        .secondary { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>
<div class="wrap">
    <h1>404</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="links">
        <a class="primary" href="/Selenium-Craft-Demo/">Home</a>
        <a class="secondary" href="/Selenium-Craft-Demo/docs/">Documentation</a>
        <a class="secondary" href="/Selenium-Craft-Demo/about/">About</a>
    </div>
</div>
</body>
</html>
